[package]
name = "loglikelihood"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
inferlet = { path = "../../sdk/rust/inferlet" }
inferlet-macros = { path = "../../sdk/rust/inferlet-macros" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = true
